<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>6과 형성평가 - The Beauty of Art</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">

  <!-- ===== 시작 화면 ===== -->
  <section id="startScreen" class="screen">
    <div class="planner-card">
      <p class="eyebrow">중학 영어 1 · Lesson 6</p>
      <h1 class="title">The Beauty of Art</h1>
      <p class="subtitle">형성평가 5문제로 오늘 배운 내용을 확인해봐요</p>
      <div class="meta-row">
        <span class="meta-chip">어휘 1</span>
        <span class="meta-chip">문법 2</span>
        <span class="meta-chip">독해 2</span>
      </div>
      <button type="button" id="startBtn" class="primary-btn">시작하기</button>
    </div>
  </section>

  <!-- ===== 퀴즈 화면 ===== -->
  <section id="quizScreen" class="screen" hidden>
    <div class="quiz-head">
      <span id="qIndex" class="q-index">1 / 5</span>
      <div class="track">
        <div class="track-fill" id="quizTrack"></div>
      </div>
    </div>

    <div class="planner-card">
      <p id="passage" class="passage" hidden></p>
      <h2 id="questionText" class="question-text"></h2>
      <div id="choices" class="choices"></div>
      <div id="feedback" class="feedback" hidden>
        <p id="feedbackTitle" class="feedback-title"></p>
        <p id="feedbackExplain" class="feedback-explain"></p>
        <button type="button" id="nextBtn" class="primary-btn">다음 문제</button>
      </div>
    </div>
  </section>

  <!-- ===== 결과 화면 ===== -->
  <section id="resultScreen" class="screen" hidden>
    <div class="planner-card">
      <p class="eyebrow">수고했어요</p>
      <h1 class="title">결과 확인</h1>
      <div class="score">
        <span id="scoreNum">0</span><span class="score-slash">/</span><span>5</span>
      </div>
      <p id="scoreMsg" class="score-msg"></p>
      <div id="reviewList" class="review-list"></div>
      <button type="button" id="retryBtn" class="primary-btn">다시 풀기</button>
    </div>
  </section>

</div>

<script src="app.js"></script>
</body>
</html>
